<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>dtrsm — wgblas browser example</title>
    <script src="https://unpkg.com/wgblas/dist/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, dtrsm, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        // Solves A*X = B for X, overwriting B. With B the identity, X is
        // A's inverse, whose thirds show the precision: about 15 correct
        // digits (double-double's ~48 bits, a little short of f64's 53).
        const n = 3, lda = n;
        const A = new Float64Array([3, 0, 0,
                                    1, 3, 0,
                                    1, 1, 3]);
        const B = new Float64Array([1, 0, 0,
                                    0, 1, 0,
                                    0, 0, 1]);

        const { B: result } = await dtrsm(device, "left", "lower", "no-transpose", "non-unit", n, n, 1, A, lda, B, lda);

        document.getElementById("out").textContent = [
          "A (lower triangular) =",
          "  [" + A.slice(0, 3).join(", ") + "]",
          "  [" + A.slice(3, 6).join(", ") + "]",
          "  [" + A.slice(6, 9).join(", ") + "]",
          "X solving A*X = I, i.e. A's inverse =",
          "  [" + result.slice(0, 3).join(", ") + "]",
          "  [" + result.slice(3, 6).join(", ") + "]",
          "  [" + result.slice(6, 9).join(", ") + "]",
        ].join("\n");

        cleanup();
      })().catch((err) => {
        document.getElementById("out").textContent = "Error: " + err.message;
      });
    </script>
  </body>
</html>

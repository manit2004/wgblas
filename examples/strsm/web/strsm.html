<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>strsm — wgblas browser example</title>
    <script src="https://unpkg.com/wgblas/dist/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, strsm, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        // Solves A*X = B, overwriting B. Passing B = A recovers the identity,
        // undoing what the strmm example does.
        const n = 3, lda = n;
        const A = new Float32Array([2, 0, 0,
                                    3, 4, 0,
                                    5, 6, 8]);
        const B = new Float32Array([2, 0, 0,
                                    3, 4, 0,
                                    5, 6, 8]);

        const { B: result } = await strsm(device, "left", "lower", "no-transpose", "non-unit", n, n, 1, A, lda, B, lda);

        document.getElementById("out").textContent = [
          "A (lower triangular) = B =",
          "  [" + A.slice(0, 3).join(", ") + "]",
          "  [" + A.slice(3, 6).join(", ") + "]",
          "  [" + A.slice(6, 9).join(", ") + "]",
          "X solving A*X = B, i.e. the identity =",
          "  [" + result.slice(0, 3).join(", ") + "]",
          "  [" + result.slice(3, 6).join(", ") + "]",
          "  [" + result.slice(6, 9).join(", ") + "]",
        ].join("\n");

        cleanup();
      })();
    </script>
  </body>
</html>

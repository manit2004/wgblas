<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>strmm — wgblas browser example</title>
    <script src="https://unpkg.com/wgblas/dist/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, strmm, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        // B := A*B in place, A lower triangular. Starting from the identity,
        // B ends up holding the dense triangle of A.
        const n = 3, lda = n;
        const A = new Float32Array([2, 0, 0,
                                    3, 4, 0,
                                    5, 6, 8]);
        const B = new Float32Array([1, 0, 0,
                                    0, 1, 0,
                                    0, 0, 1]);

        const { B: result } = await strmm(device, "left", "lower", "no-transpose", "non-unit", n, n, 1, A, lda, B, lda);

        document.getElementById("out").textContent = [
          "A (lower triangular) =",
          "  [" + A.slice(0, 3).join(", ") + "]",
          "  [" + A.slice(3, 6).join(", ") + "]",
          "  [" + A.slice(6, 9).join(", ") + "]",
          "B = A*I = A =",
          "  [" + result.slice(0, 3).join(", ") + "]",
          "  [" + result.slice(3, 6).join(", ") + "]",
          "  [" + result.slice(6, 9).join(", ") + "]",
        ].join("\n");

        cleanup();
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>scopy — wgblas browser example</title>
    <script src="https://manit2004.github.io/wgblas/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, scopy, randomFloat32Array, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        const n = 10;
        const x = randomFloat32Array(n, -10, 10);
        const y = randomFloat32Array(n, -10, 10);

        const xBefore = Array.from(x).map(v => v.toFixed(4)).join(", ");
        const yBefore = Array.from(y).map(v => v.toFixed(4)).join(", ");

        const { y: resultY } = await scopy(device, n, x, 1, y, 1);

        document.getElementById("out").textContent =
          "x before: " + xBefore +
          "\ny before: " + yBefore +
          "\ny after:  " + Array.from(resultY).map(v => v.toFixed(4)).join(", ");

        cleanup();
      })();
    </script>
  </body>
</html>

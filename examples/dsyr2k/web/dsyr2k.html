<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>dsyr2k — wgblas browser example</title>
    <script src="https://unpkg.com/wgblas/dist/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, dsyr2k, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        // With B = A the two rank-k terms are equal, so the result is exactly
        // twice dsyrk's on the same A.
        const n = 3, k = 2;
        const A = new Float64Array([1, 0,
                                    0, 1,
                                    1, 1]);
        const B = new Float64Array([1, 0,
                                    0, 1,
                                    1, 1]);
        const C = new Float64Array(n * n);

        const { C: result } = await dsyr2k(device, "upper", "no-transpose", n, k, 1, A, k, B, k, 0, C, n);

        document.getElementById("out").textContent = [
          "A = B =",
          "  [" + A.slice(0, 2).join(", ") + "]",
          "  [" + A.slice(2, 4).join(", ") + "]",
          "  [" + A.slice(4, 6).join(", ") + "]",
          "C = upper(A*B^T + B*A^T) =",
          "  [" + result.slice(0, 3).join(", ") + "]",
          "  [" + result.slice(3, 6).join(", ") + "]",
          "  [" + result.slice(6, 9).join(", ") + "]",
        ].join("\n");

        cleanup();
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>sgemv — wgblas browser example</title>
    <script src="https://unpkg.com/wgblas/dist/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, sgemv, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        // y = A*x with A a 2x3 row-major matrix.
        const m = 2, n = 3, lda = n;
        const A = new Float32Array([1, 2, 3,
                                    4, 5, 6]);
        const x = new Float32Array([1, 1, 1]);
        const y = new Float32Array([0, 0]);

        const { y: result } = await sgemv(device, "no-transpose", m, n, 1, A, lda, x, 1, 0, y, 1);

        document.getElementById("out").textContent = [
          "A =",
          "  [" + [...A.subarray(0, 3)].join(", ") + "]",
          "  [" + [...A.subarray(3, 6)].join(", ") + "]",
          "x = [" + [...x].join(", ") + "]",
          "y = A*x = [" + [...result].join(", ") + "]   // row sums: 1+2+3, 4+5+6",
        ].join("\n");

        cleanup();
      })();
    </script>
  </body>
</html>

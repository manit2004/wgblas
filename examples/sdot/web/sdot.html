<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>sdot — wgblas browser example</title>
    <script src="https://manit2004.github.io/wgblas/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, sdot, randomFloat32Array, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        const n = 10;
        const x = randomFloat32Array(n, -10, 10);
        const y = randomFloat32Array(n, -10, 10);

        const { dot } = await sdot(device, n, x, 1, y, 1);

        document.getElementById("out").textContent =
          "x:   " + Array.from(x).map(v => v.toFixed(4)).join(", ") +
          "\ny:   " + Array.from(y).map(v => v.toFixed(4)).join(", ") +
          "\ndot: " + dot.toFixed(4);

        cleanup();
      })();
    </script>
  </body>
</html>

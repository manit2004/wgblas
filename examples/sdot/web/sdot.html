<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>sdot — wgblas browser example</title>
    <script src="https://unpkg.com/wgblas/dist/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, sdot, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        const n = 5;
        const x = new Float32Array([1, 2, 3, 4, 5]);
        const y = new Float32Array([1, 1, 1, 1, 1]);

        const { dot } = await sdot(device, n, x, 1, y, 1);

        document.getElementById("out").textContent =
          "x:   " + Array.from(x).map(v => v.toFixed(4)).join(", ") +
          "\ny:   " + Array.from(y).map(v => v.toFixed(4)).join(", ") +
          "\ndot: " + dot.toFixed(4);

        cleanup();
      })();
    </script>
  </body>
</html>

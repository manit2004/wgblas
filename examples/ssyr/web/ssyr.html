<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ssyr — wgblas browser example</title>
    <script src="https://unpkg.com/wgblas/dist/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, ssyr, randomFloat32Array, cleanup } = window.wgblas;

      // Reshapes a flat row-major array into a newline-per-row grid for display.
      function matrixText(A, rows, cols, lda) {
        const lines = [];
        for (let r = 0; r < rows; r++) {
          const row = [];
          for (let c = 0; c < cols; c++) row.push(A[r * lda + c].toFixed(4));
          lines.push(row.join(", "));
        }
        return lines.join("\n");
      }

      (async () => {
        const device = await init();

        const n = 4, lda = n;
        const alpha = 1.0;
        const x = randomFloat32Array(n, -10, 10);
        const A = randomFloat32Array(n * lda, -10, 10); // only lower triangle is read/updated

        const { A: result } = await ssyr(device, "lower", n, alpha, x, 1, A, lda, "row-major");

        document.getElementById("out").textContent =
          "x: " + Array.from(x).map(v => v.toFixed(4)).join(", ") +
          "\nA (lower triangle, before):\n" + matrixText(A, n, n, lda) +
          "\nA (lower triangle, after):\n" + matrixText(result, n, n, lda);

        cleanup();
      })();
    </script>
  </body>
</html>

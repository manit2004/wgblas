<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ssyr — wgblas browser example</title>
    <script src="https://manit2004.github.io/wgblas/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, ssyr, randomFloat32Array, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        const n = 4, lda = n;
        const alpha = 1.0;
        const x = randomFloat32Array(n, -10, 10);
        const A = randomFloat32Array(n * lda, -10, 10); // only lower triangle is read/updated

        const { A: result } = await ssyr(device, "lower", n, alpha, x, 1, A, lda);

        document.getElementById("out").textContent =
          "x: " + Array.from(x).map(v => v.toFixed(4)).join(", ") +
          "\nA (lower triangle, before): " + Array.from(A).map(v => v.toFixed(4)).join(", ") +
          "\nA (lower triangle, after): " + Array.from(result).map(v => v.toFixed(4)).join(", ");

        cleanup();
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>srotm — wgblas browser example</title>
    <script src="https://unpkg.com/wgblas/dist/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, srotm, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        const n = 5;
        const x = new Float32Array([1, 2, 3, 4, 5]);
        const y = new Float32Array([10, 20, 30, 40, 50]);

        // flag = -1: full 2x2 matrix H
        // H = [ h11  h12 ]  =  [ 2   1 ]
        //     [ h21  h22 ]     [ 1  -1 ]
        const param = new Float32Array([-1, 2, 1, 1, -1]);

        const xBefore = Array.from(x).map(v => v.toFixed(4)).join(", ");
        const yBefore = Array.from(y).map(v => v.toFixed(4)).join(", ");

        const { x: xOut, y: yOut } = await srotm(device, n, x, 1, y, 1, param);

        document.getElementById("out").textContent =
          "x (before): " + xBefore +
          "\ny (before): " + yBefore +
          "\nx (after):  " + Array.from(xOut).map(v => v.toFixed(4)).join(", ") +
          "\ny (after):  " + Array.from(yOut).map(v => v.toFixed(4)).join(", ");

        cleanup();
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>sasum — wgblas browser example</title>
    <script src="https://unpkg.com/wgblas/dist/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, sasum, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        const n = 5;
        const x = new Float32Array([1, -2, 3, -4, 5]);

        const { asum } = await sasum(device, n, x, 1);

        document.getElementById("out").textContent =
          "x:    " + Array.from(x).map(v => v.toFixed(4)).join(", ") +
          "\nasum: " + asum.toFixed(4);

        cleanup();
      })();
    </script>
  </body>
</html>

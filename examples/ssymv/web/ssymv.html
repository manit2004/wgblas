<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ssymv — wgblas browser example</title>
    <script src="https://unpkg.com/wgblas/dist/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, ssymv, randomFloat32Array, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        const n = 4, lda = n;
        const alpha = 1.0, beta = 0.0;
        const A = randomFloat32Array(n * lda, -10, 10); // only lower triangle is read
        const x = randomFloat32Array(n, -10, 10);
        const y = randomFloat32Array(n, -10, 10);

        const { y: result } = await ssymv(device, "lower", n, alpha, A, lda, x, 1, beta, y, 1, "row-major");

        document.getElementById("out").textContent =
          "A (lower triangle): " + Array.from(A).map(v => v.toFixed(4)).join(", ") +
          "\nx: " + Array.from(x).map(v => v.toFixed(4)).join(", ") +
          "\ny: " + Array.from(result).map(v => v.toFixed(4)).join(", ");

        cleanup();
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ssymm — wgblas browser example</title>
    <script src="https://unpkg.com/wgblas/dist/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, ssymm, randomFloat32Array, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        const m = 4, n = 3;
        const lda = m, ldb = n, ldc = n;
        const alpha = 1.0, beta = 0.0;
        const A = randomFloat32Array(m * lda, -10, 10);
        const B = randomFloat32Array(m * ldb, -10, 10);
        const C = randomFloat32Array(m * ldc, -10, 10);

        const { C: result } = await ssymm(device, "left", "lower", m, n, alpha, A, lda, B, ldb, beta, C, ldc, "row-major");

        document.getElementById("out").textContent =
          "A: " + Array.from(A).map(v => v.toFixed(4)).join(", ") +
          "\nB: " + Array.from(B).map(v => v.toFixed(4)).join(", ") +
          "\nC (= A*B): " + Array.from(result).map(v => v.toFixed(4)).join(", ");

        cleanup();
      })();
    </script>
  </body>
</html>

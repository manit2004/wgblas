<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>sgemmtr — wgblas browser example</title>
    <script src="https://unpkg.com/wgblas/dist/wgblas.browser.js"></script>
  </head>
  <body>
    <pre id="out">Running…</pre>
    <script>
      const { init, sgemmtr, cleanup } = window.wgblas;

      (async () => {
        const device = await init();

        // A all ones times the identity is all ones, so the masking is obvious:
        // only the upper triangle of C is written.
        const n = 3, lda = n;
        const A = new Float32Array([1, 1, 1,
                                    1, 1, 1,
                                    1, 1, 1]);
        const B = new Float32Array([1, 0, 0,
                                    0, 1, 0,
                                    0, 0, 1]);
        const C = new Float32Array(n * n);

        const { C: result } = await sgemmtr(device, "upper", "no-transpose", "no-transpose", n, n, n, 1, A, lda, B, lda, 0, C, lda);

        document.getElementById("out").textContent = [
          "A = all ones, B = identity, so A*B is all ones",
          "C = upper(A*B) =",
          "  [" + result.slice(0, 3).join(", ") + "]",
          "  [" + result.slice(3, 6).join(", ") + "]",
          "  [" + result.slice(6, 9).join(", ") + "]",
        ].join("\n");

        cleanup();
      })();
    </script>
  </body>
</html>

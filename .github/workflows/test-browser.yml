name: Browser Tests

# The suite in a real browser: each runner's preinstalled Google Chrome, driven
# by Playwright (tests/browser/run.mjs). This is Chrome's own WebGPU, which on
# Windows compiles shaders with DXC, as the webgpu npm package's Dawn can't.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    name: Chrome (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Linux, verified locally on Chrome's SwiftShader, is blocking; Windows and
    # macOS are not until a run shows they pass.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      # Keep LF line endings, as on Linux.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Prints the browser and the WebGPU adapter it offers, then fails at once
      # if there is none.
      - name: Test suite
        run: node tests/browser/run.mjs

      # Temporary diagnostics: dtrsv's block solve (dtrsv_small) gives wrong
      # answers in Chrome on Windows (D3D12 on WARP) for every n > 1, but passes
      # under the webgpu package's Dawn on the same WARP, whose HLSL compiler is
      # FXC. Chrome's is DXC. The same tests with DXC turned off tell a DXC
      # miscompile from anything else; Dawn's shader dump, printed to the page
      # console, shows the HLSL DXC was given.
      - name: "Diagnose dtrsv: DXC off"
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        env:
          WGBLAS_BROWSER_ARGS: --disable-dawn-features=use_dxc
        run: node tests/browser/run.mjs tests/dtrsv/src/test.dtrsv.js

      - name: "Diagnose dtrsv: shader dump"
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        env:
          WGBLAS_BROWSER_ARGS: --enable-dawn-features=dump_shaders
        run: node tests/browser/run.mjs tests/dtrsv/src/test.dtrsv.js

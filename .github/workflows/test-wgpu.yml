name: wgpu Tests

# The suite on wgpu (Firefox's engine), through Deno's WebGPU
# (tests/wgpu/run.mjs), without a real GPU: Vulkan on Mesa's lavapipe, Metal on
# Apple's paravirtual GPU. Shaders go through naga instead of Dawn's Tint.
#
# No Windows job: wgpu's D3D12 on WARP (the hosted runners' only adapter) took
# ~40 minutes, mostly FXC optimising a few large shaders, and 7 test files
# crashed inside WARP's shader JIT
# (d3d10warp!ComputeShaderTransformer::ConstructLoadStoreSets), a WARP bug,
# not wgpu's or wgblas's. D3D12 stays covered by Dawn on WARP (test-dawn.yml)
# and Chrome on Windows (test-browser.yml).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lavapipe:
    name: wgpu on Vulkan (lavapipe, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-deno

      - uses: ./.github/actions/lavapipe

      # Deno also enables wgpu's GL backend, which finds the same CPU renderer
      # through EGL and can't run compute shaders; keep it on Vulkan.
      - name: make test-wgpu
        env:
          DENO_WEBGPU_BACKEND: vulkan
        run: make test-wgpu

  metal:
    name: wgpu on Metal (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    # Apple's paravirtual GPU. Shaders go through naga's MSL.
    env:
      DENO_WEBGPU_BACKEND: metal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-deno

      # Fails here, plainly, if wgpu finds no adapter.
      - name: Which adapter
        run: |
          deno eval --unstable-webgpu '
            const a = await navigator.gpu.requestAdapter();
            if (!a) { console.error("wgpu found no adapter"); Deno.exit(1); }
            console.log(a.info);
          '

      - run: make test-wgpu

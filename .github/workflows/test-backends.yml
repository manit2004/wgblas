name: Backend Tests

# GPU-free coverage beyond the Kaggle job's NVIDIA/Dawn run: naga's output for
# every backend, the suite on Mesa's lavapipe (a CPU Vulkan driver) under both
# Dawn and wgpu, and the suite on Metal and on D3D12 (WARP, a CPU driver)
# under both Dawn and wgpu, with Dawn's D3D12 shaders compiled by FXC and,
# as Chrome does, by DXC.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shaders:
    name: Shaders (naga, spirv-val, dxc, glslang)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The naga version is pinned in .cargo/config.toml, so that keys the cache.
      - name: Cache naga
        id: naga
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/naga
          key: naga-${{ runner.os }}-${{ hashFiles('.cargo/config.toml') }}

      - name: Install naga
        if: steps.naga.outputs.cache-hit != 'true'
        run: make install-naga

      - name: Install spirv-val, glslangValidator and dxc
        run: |
          sudo apt-get update
          make install-shader-tools

      # The tests skip a missing tool, so check they're all here first.
      - name: Check tools
        run: |
          naga --version
          spirv-val --version
          glslangValidator --version
          ~/.local/share/dxc/bin/dxc --version

      # test.dawn.js needs a GPU; the lavapipe jobs below run it.
      - name: naga validation and backend output
        run: node --test --test-reporter=spec tests/shaders/src/test.naga.js tests/shaders/src/test.backends.js

  lavapipe-dawn:
    name: Suite on lavapipe (Dawn)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Point the Vulkan loader at lavapipe alone, wherever this Ubuntu's
      # package puts its manifest (the name varies by release and CPU level).
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          icd=$(dpkg -L mesa-vulkan-drivers | grep -m1 '/lvp_icd[^/]*\.json$' || true)
          if [ -z "$icd" ]; then
            echo "No lavapipe ICD manifest in mesa-vulkan-drivers:"
            dpkg -L mesa-vulkan-drivers | grep '\.json$'
            exit 1
          fi
          echo "lavapipe: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - run: make test

      - run: make test-gpu

  lavapipe-wgpu:
    name: Suite on lavapipe (wgpu, via Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8

      # Point the Vulkan loader at lavapipe alone, wherever this Ubuntu's
      # package puts its manifest (the name varies by release and CPU level).
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          icd=$(dpkg -L mesa-vulkan-drivers | grep -m1 '/lvp_icd[^/]*\.json$' || true)
          if [ -z "$icd" ]; then
            echo "No lavapipe ICD manifest in mesa-vulkan-drivers:"
            dpkg -L mesa-vulkan-drivers | grep '\.json$'
            exit 1
          fi
          echo "lavapipe: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      # Deno also enables wgpu's GL backend, which finds the same CPU renderer
      # through EGL and can't run compute shaders; keep it on Vulkan.
      - name: make test-wgpu
        env:
          DENO_WEBGPU_BACKEND: vulkan
        run: make test-wgpu

  metal:
    name: Suite on Metal (Dawn, macOS)
    runs-on: macos-15
    timeout-minutes: 30
    # Dawn gets a Metal adapter here (Apple's paravirtual GPU) and compiles
    # under relaxed math, the case f64/utils/add.wgsl's hide() exists for.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Which GPU
        run: |
          node --input-type=module -e '
            import { init, gpuName, cleanup } from "wgblas";
            await init();
            console.log(gpuName());
            cleanup();
            process.exit(0);
          '

      - run: make test

      - run: make test-gpu

  warp:
    name: Suite on D3D12 WARP (Dawn, Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    # Hosted Windows runners have no GPU; Dawn's default Windows backend,
    # D3D12, then finds only WARP, Microsoft's software rasterizer. Shaders go
    # through the FXC compiler the webgpu package ships (d3dcompiler_47.dll).
    defaults:
      run:
        shell: bash
    steps:
      # Keep LF line endings, as on Linux and macOS.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Which GPU
        run: |
          node --input-type=module -e '
            import { init, gpuName, cleanup } from "wgblas";
            await init();
            console.log(gpuName());
            cleanup();
            process.exit(0);
          '

      # make test / make test-gpu, without depending on make being installed.
      - name: Test suite
        run: node --test --test-reporter=spec $(find tests -name 'test.*.js')

      - name: GPU-resident suite
        run: node --test --test-reporter=spec $(find tests -name 'gpustorage.*.js')

  wgpu-native:
    name: Suite on wgpu (Deno, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # No GPU: WARP, if wgpu offers it. Shaders go through naga's HLSL.
          - os: windows-latest
            backend: dx12
          # Apple's paravirtual GPU. Shaders go through naga's MSL.
          - os: macos-15
            backend: metal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Non-blocking until a run shows the suite passes there: naga's HLSL and
    # MSL haven't run anywhere else in CI.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      DENO_WEBGPU_BACKEND: ${{ matrix.backend }}
    steps:
      # Keep LF line endings, as on Linux.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8

      # wgpu may not hand out a CPU adapter like WARP; fail here, plainly, if not.
      - name: Which adapter
        run: |
          deno eval --unstable-webgpu '
            const a = await navigator.gpu.requestAdapter();
            if (!a) { console.error("wgpu found no adapter"); Deno.exit(1); }
            console.log(a.info);
          '

      # make test-wgpu, without depending on make being installed.
      - name: Test suite
        run: node tests/wgpu/run.mjs

  dxc:
    name: Suite on D3D12 WARP with DXC (Dawn, Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    # Chrome on Windows compiles shaders with DXC; the webgpu package, as in
    # the warp job, uses FXC. Dawn's use_dxc toggle (set by
    # tests/dxc/preload.mjs) switches to DXC once dxcompiler.dll and dxil.dll
    # are there to load. Non-blocking until a run shows the suite passes.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      DXC_ZIP: https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip
    steps:
      # Keep LF line endings, as on Linux and macOS.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The x64 DLLs next to Dawn's binary, and that directory on PATH, the two
      # places a DLL load is likely to look.
      - name: Install DXC beside Dawn
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dxc.zip" "$DXC_ZIP"
          pwsh -NoProfile -Command "Expand-Archive -Path '$RUNNER_TEMP/dxc.zip' -DestinationPath '$RUNNER_TEMP/dxc'"
          dist=node_modules/webgpu/dist
          for dll in dxcompiler.dll dxil.dll; do
            src=$(find "$RUNNER_TEMP/dxc" -ipath '*x64*' -iname "$dll" | head -1)
            if [ -z "$src" ]; then echo "No x64 $dll in $DXC_ZIP"; exit 1; fi
            echo "$dll: $src"
            cp "$src" "$dist/"
          done
          (cd "$dist" && pwd -W) >> "$GITHUB_PATH"

      # Fails unless Dawn's shader dump shows DXC compiled the kernel, so the
      # suite below can't pass on a silent fallback to FXC.
      - name: Confirm DXC is used
        run: node tests/dxc/check.mjs

      - name: Test suite
        env:
          NODE_OPTIONS: --import=./tests/dxc/preload.mjs
        run: node --test --test-reporter=spec $(find tests -name 'test.*.js')

      - name: GPU-resident suite
        env:
          NODE_OPTIONS: --import=./tests/dxc/preload.mjs
        run: node --test --test-reporter=spec $(find tests -name 'gpustorage.*.js')

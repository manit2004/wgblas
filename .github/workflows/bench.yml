name: GPU Benchmarks (Kaggle)

on:
  workflow_dispatch:   # manual trigger from GitHub Actions UI
  schedule:
    - cron: "0 3 * * 1"  # weekly, Monday 03:00 UTC

jobs:
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit results back
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Push kernel to Kaggle
        run: kaggle kernels push -p benchmarks/kaggle/

      - name: Wait for kernel to complete
        run: |
          KERNEL="manitroy/wgblas-bench"
          echo "Polling $KERNEL ..."
          while true; do
            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 | grep -oP '(?<=status )\S+')
            echo "$(date -u +%H:%M:%S)  status: $STATUS"
            case "$STATUS" in
              complete)
                echo "Kernel finished successfully."
                break ;;
              error|cancelAcknowledged|cancelled)
                echo "Kernel stopped with: $STATUS"
                exit 1 ;;
            esac
            sleep 60
          done

      - name: Download kernel output
        run: |
          kaggle kernels output "manitroy/wgblas-bench" \
            -p /tmp/bench-output
          echo "Output files:"
          find /tmp/bench-output -type f

      - name: Copy results into repo
        run: |
          if [ ! -d /tmp/bench-output/results ]; then
            echo "No results/ directory in kernel output — aborting"
            exit 1
          fi
          cp -r /tmp/bench-output/results/. benchmarks/results/

      - name: Regenerate benchmark table modules
        run: python3 scripts/gen-bench-tables.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/ benchmarks/bench-result/
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: update Kaggle benchmark results"
          git push

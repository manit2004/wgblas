name: GPU Tests (Kaggle)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gpu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Install Kaggle CLI
        run: pip install "kaggle==1.6.17"

      - name: Write Kaggle credentials
        env:
          KAGGLE_KEY: ${{ secrets.MANITROY }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"manitroy","key":"%s"}' "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Push test kernel to Kaggle
        run: kaggle kernels push -p tests/kaggle/

      - name: Wait for kernel to complete
        run: |
          KERNEL="manitroy/wgblas-test"
          echo "Polling $KERNEL ..."
          while true; do
            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 | grep -oP '(?<=status )\S+' | tr -d '"')
            echo "$(date -u +%H:%M:%S)  status: $STATUS"
            case "$STATUS" in
              complete)
                echo "Kernel finished — tests passed."
                break ;;
              error|cancelAcknowledged|cancelled)
                echo "Kernel stopped with: $STATUS — tests failed or kernel errored."
                exit 1 ;;
            esac
            sleep 60
          done

      - name: Download test output
        run: |
          n=0
          until kaggle kernels output "manitroy/wgblas-test" -p /tmp/test-output; do
            n=$((n+1))
            if [ $n -ge 3 ]; then
              echo "Download failed after 3 attempts"
              exit 1
            fi
            echo "Download attempt $n failed (Kaggle API is occasionally flaky) — retrying in 10s..."
            sleep 10
          done
          echo "--- Test output ---"
          cat /tmp/test-output/test-output.txt || echo "(no output file found)"

      # CODECOV_TOKEN is a repo secret (Settings > Secrets and variables >
      # Actions) — never hardcode the raw token value here.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@5975040f7f7d40edaff8d784b576fd65ae95c073 # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: /tmp/test-output/coverage/lcov.info
          fail_ci_if_error: false

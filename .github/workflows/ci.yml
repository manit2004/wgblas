name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: make typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format check
        run: npx prettier --check "src/**/*.{js,mjs,cjs}" "tests/**/*.{js,mjs,cjs}" "examples/**/*.{js,mjs,cjs}" "benchmarks/**/*.{js,mjs,cjs}" "scripts/**/*.{js,mjs,cjs}" "*.{js,mjs,cjs}"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # What users install: wgblas's runtime dependencies. A high finding here
      # fails the job.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Development tooling (ESLint, TypeDoc, Vite, c8, lint-staged): reported,
      # not blocking. Its findings are in glob-matching libraries that only
      # ever see this repo's own patterns, and some have no fixed release
      # (picomatch's ReDoS covers every version). npm's offered "fix"
      # (`npm audit fix --force`) downgrades those tools a major version,
      # which breaks the build: TypeDoc 0.23 can't run TypeScript 6.
      - name: Audit development tooling (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

  # The markdown, and the docs site as the Docs workflow would deploy it:
  # docs/ isn't committed, so it's built here first, which also catches a
  # docs build that fails before it reaches main.
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build the docs
        run: npm run docs

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --exclude-path node_modules --exclude "^https://www\.npmjs\.com" "**/*.md" "docs/**/*.html"
          fail: true
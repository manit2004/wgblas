name: Set up Deno
description: >
  Deno, whose WebGPU is wgpu (Firefox's engine), for tests/wgpu/run.mjs. CI's
  Deno version is pinned here alone (make install-deno takes the latest); the
  wgpu skips and the Deno bug reports were checked against it.

runs:
  using: composite
  steps:
    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: 2.9.8
